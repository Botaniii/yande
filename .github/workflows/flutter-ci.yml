name: Flutter CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  apk:
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get

      - name: Setup release keystore
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "${{ secrets.YANDE_STORE_FILE }}" | base64 -d > "$RUNNER_TEMP/yande-release.jks"

      - name: Build APK (debug)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: flutter build apk --debug

      - name: Build APK (release signed)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          YANDE_STORE_FILE: ${{ runner.temp }}/yande-release.jks
          YANDE_STORE_PASSWORD: ${{ secrets.YANDE_STORE_PASSWORD }}
          YANDE_KEY_ALIAS: ${{ secrets.YANDE_KEY_ALIAS }}
          YANDE_KEY_PASSWORD: ${{ secrets.YANDE_KEY_PASSWORD }}
        run: flutter build apk --release --target-platform android-arm64,android-arm,android-x64

      - name: Rename release APK
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/yande-${{ github.ref_name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yande-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 - <<'PYEOF'
          import re
          from pathlib import Path
          tag = "${{ github.ref_name }}"
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          blocks = re.split(r"(?m)^## ", text)
          for block in blocks:
              if block.startswith(tag):
                  Path("release_notes.md").write_text("## " + block.rstrip() + "\n", encoding="utf-8")
                  break
          PYEOF
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/yande-${{ github.ref_name }}.apk
          body_path: release_notes.md